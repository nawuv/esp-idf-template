name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install formatter
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18
      - name: Check C++ formatting
        run: python3 tools/format.py --check
      - name: Run portable policy tests
        run: bash tools/test-host.sh
      - name: Test firmware packaging
        run: python3 -m unittest discover -s tests/tools -v

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - name: Build documentation
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: python -m mkdocs build --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-site
          path: site/
          if-no-files-found: error
      - name: Prepare Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/

  release-tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:release

  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: esp32s3
            project: .
          - name: unity
            project: tests/target
          - name: simulation
            project: examples/simulation
          - name: sensor-node
            project: examples/sensor-node
          - name: actuator-node
            project: examples/actuator-node
    container: espressif/idf:v5.4.2@sha256:4317595a911886e04cbc6d731315d5fc2918e510b6733fc7d03381ab2d270082
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and package firmware
        shell: bash
        env:
          PROJECT_DIR: ${{ matrix.project }}
          ARTIFACT_NAME: ${{ matrix.name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C "$PROJECT_DIR" set-target esp32s3
          idf.py -C "$PROJECT_DIR" build
          idf.py -C "$PROJECT_DIR" size
          python tools/package_firmware.py \
            --build-dir "$PROJECT_DIR/build" \
            --output "release-assets/$ARTIFACT_NAME" \
            --source-sha "$SOURCE_SHA" \
            --sdk-version "$(idf.py --version)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}-firmware
          path: release-assets/${{ matrix.name }}/
          if-no-files-found: error

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
    needs: [host-tests, documentation, release-tooling, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_RELEASES == 'true'
    needs: [host-tests, documentation, release-tooling, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: esp32s3-firmware
          path: release-assets/
      - name: Verify artifact identity and integrity
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS
          python -c 'import json, os; m=json.load(open("manifest.json")); assert m["source_sha"] == os.environ["GITHUB_SHA"], "Firmware/source commit mismatch"'
      - name: Check that this main commit is still current
        id: current
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded main build."
          fi
      - name: Publish release when commits require it
        if: steps.current.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
